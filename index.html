<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Hỗ Trợ Học Vụ TLU</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="theme-blue"> <div id="login-screen" class="screen-container active">
        <div class="login-box">
            <img src="https://inkythuatso.com/uploads/thumbnails/800/2021/12/logo-dai-hoc-thuy-loi-inkythuatso-converted-01-23-08-45-05.jpg" alt="TLU Logo" class="logo">
            <h2>Đăng nhập Hệ thống</h2>
            <p>Sử dụng email sinh viên @tlu.edu.vn</p>
            
            <form id="login-form">
                <input type="email" id="email" placeholder="MãSinhVien@tlu.edu.vn" required>
                <input type="password" id="password" placeholder="Mật khẩu" required>
                <button type="submit" id="login-btn">Đăng nhập</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <div id="app-shell" class="screen-container">
        <header class="app-header">
            <div class="header-title">TLU Helpdesk</div>
            <div class="theme-switcher">
                <button onclick="changeTheme('theme-blue')" style="background: #0056b3;"></button>
                <button onclick="changeTheme('theme-pink')" style="background: #e91e63;"></button>
                <button onclick="changeTheme('theme-orange')" style="background: #ff9800;"></button>
                <button onclick="changeTheme('theme-black')" style="background: #333333;"></button>
                <button id="logout-btn">Đăng xuất</button>
            </div>
        </header>

        <main id="main-app-content">
            <h2>Chào mừng bạn đến với Cổng hỗ trợ học vụ</h2>
            <p>Nội dung</p>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-target="home">Trang chủ</button>
            <button class="nav-item" data-target="saved">Đã lưu</button>
            <button class="nav-item" data-target="history">Lịch sử</button>
        </nav>
    </div>

    <!-- ============================================ -->
    <!-- TV2: FAQ DETAIL MODAL POPUP                  -->
    <!-- ============================================ -->
    <div class="modal-overlay" id="faq-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-header">
                <span class="modal-category-badge" id="modal-category"></span>
            </div>
            <h3 class="modal-question" id="modal-question"></h3>
            <div class="modal-answer" id="modal-answer"></div>

            <!-- TV3: Audio Player (TV3 sẽ implement logic playAudio) -->
            <div class="modal-audio" id="modal-audio-container">
                <button class="btn-audio" id="btn-play-audio" title="Nghe AI đọc">
                    🔊 Nghe AI đọc
                </button>
            </div>

            <!-- Modal Actions: Bookmark + Rating -->
            <div class="modal-actions">
                <button class="btn-action" id="btn-bookmark" title="Lưu câu hỏi">
                    🔖 Lưu
                </button>
                <div class="rating-group">
                    <button class="btn-rate btn-like" id="btn-like">
                        👍 <span id="like-count">0</span>
                    </button>
                    <button class="btn-rate btn-dislike" id="btn-dislike">
                        👎 <span id="dislike-count">0</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TV2: Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="app.js"></script>

<div class="modal-overlay" id="ticket-modal">
        <div class="modal-content">
            <button class="modal-close" id="ticket-modal-close">&times;</button>
            <div class="modal-header">
                <span class="modal-category-badge" style="background: var(--primary-light); color: var(--primary-color);">Gửi Yêu Cầu Hỗ Trợ Mới</span>
            </div>
            <div style="padding: 16px 24px 24px;">
                <form id="create-ticket-form">
                    <div style="margin-bottom: 16px;">
                        <label style="font-size: 0.85em; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: block;">Phòng ban tiếp nhận</label>
                        <select id="ticket-dept" style="width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 2px solid var(--border-color); font-size: 0.95em; outline: none;" required>
                            <option value="">-- Chọn phòng ban chức năng --</option>
                            <option value="DEPT_01">Phòng Đào tạo</option>
                            <option value="DEPT_02">Phòng Công tác Sinh viên</option>
                            <option value="DEPT_03">Phòng Tài chính Kế toán</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="font-size: 0.85em; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: block;">Tiêu đề yêu cầu</label>
                        <input type="text" id="ticket-subject" placeholder="Nhập tóm tắt vấn đề cần hỗ trợ..." style="width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 2px solid var(--border-color); font-size: 0.95em; outline: none;" required>
                    </div>
                    <div style="margin-bottom: 24px;">
                        <label style="font-size: 0.85em; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: block;">Nội dung chi tiết</label>
                        <textarea id="ticket-desc" rows="4" placeholder="Mô tả chi tiết thắc mắc của bạn để nhà trường phản hồi chính xác nhất..." style="width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 2px solid var(--border-color); font-size: 0.95em; outline: none; font-family: inherit;" required></textarea>
                    </div>
                    <button type="submit" id="btn-submit-ticket" style="width: 100%; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; transition: var(--transition);">
                        Gửi Ban Giám Hiệu
                    </button>
                </form>
            </div>
        </div>
    </div>   
</body>
</html>
